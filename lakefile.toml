name = "ChangFreimanRuzsa"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ChangFreimanRuzsa", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Source of Chang's lemma on large spectra.
[[require]]
name = "APAP"
git = "https://github.com/YaelDillies/apap.git"
rev = "cfce977a6d11d6175c450547e7593773e37ba36e"

# Source of Minkowski's second theorem.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "v4.35.0"

# Source of the affine dimension of a finite set, of Ruzsa's lower bound for sumsets and of the
# Freiman dimension.
[[require]]
name = "SumOfSetsInSeveralDimensions"
git = "https://github.com/gdahia/SumOfSetsInSeveralDimensions"
rev = "9a655a95e167081b5a01ad5505b13c59933457e4"

# Last, so that its pins of the shared dependencies take precedence on `lake update`. Pinned to
# the commit TauCeti v4.35.0 pins, since Palomar requires TauCeti's exact manifest closure.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "074063781836922cb02701cd12943c9f51731afa"

# The proof development; `Solution.lean` imports it.
[[lean_lib]]
name = "ChangFreimanRuzsa"

# The statement-only surface a reader audits.
[[lean_lib]]
name = "Challenge"
roots = ["ChangFreimanRuzsaPalomar.Challenge"]

# Proves the declarations stated in `Challenge.lean`; Comparator checks the two agree.
[[lean_lib]]
name = "Solution"
roots = ["ChangFreimanRuzsaPalomar.Solution"]
