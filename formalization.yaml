# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Chang's theorem"
  description: >-
    Formalization of Chang's polynomial form of Freiman's theorem, with a 2-proper
    progression as in Green and Tao: a finite set X of integers with |X + X| <= kappa |X| is
    contained in a 2-proper generalized arithmetic progression of dimension at most the
    Freiman dimension of X, hence at most 2 kappa - 1, with at most exp(10^32 kappa^7) |X|
    points. There is also a statement for subsets of ZMod q with q prime, where the
    progression has at most exp(10^30 kappa^7) |X| points. The bound on the size is weaker
    than that of Chang.
  authors:
    - "Gabriel Dahia"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Gabriel Dahia"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["11P70", "11B30", "11B13", "11H06"]

sources:
  - title: "A polynomial bound in Freiman's theorem"
    authors:
      - "Mei-Chu Chang"
    id: "https://doi.org/10.1215/S0012-7094-02-11331-3"
    type: "paper"
    location: "https://doi.org/10.1215/S0012-7094-02-11331-3"
    relationship: "adapts"
    note: >-
      The proof follows Chang's: a Ruzsa model, Chang's lemma on large spectra, a progression
      inside a Bohr set, and a covering argument. The bounds proved are weaker; see
      fidelity.divergences.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Compressions, convex geometry and the Freiman-Bilu theorem"
    authors:
      - "Ben Green"
      - "Terence Tao"
    id: "https://arxiv.org/abs/math/0511069"
    type: "paper"
    location: "https://arxiv.org/abs/math/0511069"
    relationship: "background"
    note: >-
      Proposition 1.3 states Chang's theorem with a t-proper progression. The statements
      here are the case t = 2, with weaker bounds.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "On the independence number of sparser random Cayley graphs"
    authors:
      - "Marcelo Campos"
      - "Gabriel Dahia"
      - "João Pedro Marciano"
    id: "https://arxiv.org/abs/2406.09361"
    type: "paper"
    location: "https://arxiv.org/abs/2406.09361"
    relationship: "adapts"
    note: >-
      J. London Math. Soc. 110 (2024). The reduction of the dimension of a 2-proper
      progression to the Freiman dimension of the set it contains follows Appendix A.
    license: "unknown"
    author_endorsement: "participated"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      The statements use pointwise sums of finite sets and ZMod q from Mathlib. The proofs
      use its Freiman isomorphisms, the Plünnecke-Ruzsa inequality, Ruzsa's covering lemma,
      the Fourier transform on finite abelian groups, Z-lattices and Smith normal form.
      Mathlib has no generalized arithmetic progressions and no form of Chang's theorem.
  - id: "https://github.com/gdahia/SumOfSetsInSeveralDimensions"
    relationship: "builds-on"
    note: >-
      A Lake dependency and the source of the Freiman dimension,
      SumOfSetsInSeveralDimensions.freimanDim, and of the bound
      freimanDim_le_two_mul_sub_one_of_card_add_le, which applies Ruzsa's lower bound for
      sumsets to a Freiman model of a set.
  - id: "https://github.com/YaelDillies/apap"
    relationship: "builds-on"
    note: >-
      A Lake dependency and the source of Chang's lemma on large spectra.
  - id: "https://github.com/TauCetiProject/TauCeti"
    relationship: "builds-on"
    note: >-
      A Lake dependency and the source of Minkowski's second theorem for positive definite
      integral lattices.

status:
  scope: >-
    Chang's theorem with a 2-proper progression, for subsets of ZMod q with q prime and for
    finite sets of integers, with the bounds in fidelity.divergences. Chang's lemma on large
    spectra is the one of APAP and Minkowski's second theorem the one of Tau Ceti. The main
    statements give a progression of dimension at most the Freiman dimension of the set.
    Mathlib has no Freiman dimension, so Challenge.lean states instead their corollaries with
    dimension at most 2 kappa - 1, which use the bound freimanDim X <= 2 kappa - 1 for sets
    with |X + X| <= kappa |X| from SumOfSetsInSeveralDimensions. The sorry counts refer to the
    library and Solution.lean; Challenge.lean has one placeholder for each of its two
    statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: "Lean 4, Mathlib, shell, the sources of DenseSetsWithoutLargeSumsets, APAP and Tau Ceti."
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        The work began inside the formalization of Campos, Dahia and Marciano, Counting sets
        with given doubling via dimension: one instruction to state Chang's theorem as in
        DenseSetsWithoutLargeSumsets, one to use Minkowski's second theorem from Tau Ceti and
        to import APAP, and one to move the result to this repository in a form that can be
        imported next to PFR. Later, one instruction to move the bound of the dimension by
        the Freiman dimension from DenseSetsWithoutLargeSumsets to this repository, without
        adding it to Challenge.lean. Later, one instruction to make the proof work for sets of
        integers by carrying back to the integers the progression inside 2X - 2X, instead of
        the final progression. Later, one instruction to state the main theorems with
        dimension at most the Freiman dimension, as in Green and Tao, and to deduce from them
        and the bound on the Freiman dimension the statements with dimension at most
        2 kappa - 1. Later, one instruction to lower the exponent of the size bound from
        kappa^20 to kappa^7. Later, one instruction to remove the copies of APAP modules that
        allowed importing this library next to PFR.
  spend_usd: "not tracked"
  notes: >-
    An AI agent directed by Gabriel Dahia ported the copied modules, rewrote the Bohr step
    with Minkowski's second theorem, removed unused declarations, and wrote the statements
    for ZMod q and for integers, the bounds for the exponents, Challenge.lean and
    Solution.lean. The proofs in the copied modules are those of
    DenseSetsWithoutLargeSumsets, which were written by Codex agents. The agent also rewrote
    the modules that bound the dimension by the Freiman dimension, keeping the argument and
    the definition of the Freiman dimension. For the statement for integers with a bound
    linear in |X|, the agent restated the covering argument and the properization for
    general abelian groups, replaced the successive minima of the lattice of relations by
    the number of independent short relations, and rewrote Integers.lean. Later, agents
    rewrote the proofs and docstrings of the library to follow Mathlib style: they split long
    proofs into lemmas, replaced local definitions by those of Mathlib and APAP, and renamed
    auxiliary declarations, without changing the main statements. Later, the agent derived
    the main statements with dimension at most the Freiman dimension, for every finite set
    of integers, and replaced the bounds on the dimension in Challenge.lean by 2 kappa - 1.
    Later, agents lowered the exponent from kappa^20 to kappa^7: they sharpened the
    estimates of the Bohr progression, of Chang's lemma and of properization, and added the
    elements of the last packing set as steps of the progression instead of covering by
    their differences. Every proof is checked by Lean.

fidelity:
  divergences: >-
    Chang's theorem, as in Green and Tao, Proposition 1.3 with t = 2, gives a 2-proper
    progression P containing A with |P| <= exp(C K^2 log^3 K) |A| and dimension at most the
    Freiman dimension of A, where K = |A + A| / |A|.

    Here freimanDim X is the largest d <= |X| such that X is Freiman isomorphic of order 2
    to a subset of Q^d whose affine span over the reals has dimension d.

    Integers. exists_twoProperGAP_subset_dim_le_freimanDim_card_le takes kappa >= 2 with
    |X + X| <= kappa |X| and gives |P| <= exp(10^32 kappa^7) |X| and dimension at most
    freimanDim X. The library form exists_twoProperGAP_int_dim_le_freimanDim has
    exp(intFreimanDimExponent kappa) in place of exp(10^32 kappa^7). The statement for
    ZMod q is not used directly, since a progression of ZMod q containing the reduction of
    X may wrap around: only the progression inside 2X - 2X is built modulo a prime and
    carried back to the integers, and the rest of the argument takes place in Z.

    ZMod q. exists_twoProperGAP_zmod_subset_dim_le_freimanDim_card_le is for q prime and
    needs 7 * 10^7 kappa^2 <= |X| and exp(10^30 kappa^7) |X| <= q. It gives a
    2-proper progression of dimension at most freimanDim X with at most
    exp(10^30 kappa^7) |X| points. The library form
    exists_twoProperGAP_zmod_dim_le_freimanDim is written with the exponents
    containerExponent and freimanDimExponent.

    Dimension at most 2 kappa - 1. The statements of Challenge.lean are the same with
    dimension at most 2 kappa - 1 in place of freimanDim X. Green and Tao get
    floor(K - 1 + epsilon) for |A| >= C K^2 / epsilon.

    A progression is a structure GAP with a dimension, an origin, steps and lengths; its
    points are origin + sum_i w_i step_i with 0 <= w_i < length_i. It is 2-proper if the
    points with 0 <= w_i < 2 length_i, starting from twice the origin, are distinct.

review:
  status: "unchecked"
  reviewers: []
  notes: "Unreviewed"

alignment:
  namespace: "ChangFreimanRuzsa"
  statements:
    - source: "Chang's theorem for sets of integers"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_subset_dim_le_card_le'"
      module: "ChangFreimanRuzsaPalomar.Challenge"
      status: "proved"
      note: "With at most exp(10^32 kappa^7) |X| points and dimension at most 2 kappa - 1."
    - source: "Chang's theorem in ZMod q"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_zmod_subset_dim_le_card_le'"
      module: "ChangFreimanRuzsaPalomar.Challenge"
      status: "proved"
      note: >-
        For q prime, 7 * 10^7 kappa^2 <= |X| and exp(10^30 kappa^7) |X| <= q, with
        dimension at most 2 kappa - 1.
    - source: "Chang's theorem for sets of integers with dimension at most the Freiman dimension"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_subset_dim_le_freimanDim_card_le"
      module: "ChangFreimanRuzsa.ExplicitBounds"
      status: "proved"
      note: >-
        With at most exp(10^32 kappa^7) |X| points. Not in Challenge.lean, since Mathlib has
        no Freiman dimension.
    - source: "Chang's theorem in ZMod q with dimension at most the Freiman dimension"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_zmod_subset_dim_le_freimanDim_card_le"
      module: "ChangFreimanRuzsa.ExplicitBounds"
      status: "proved"
      note: >-
        With the hypotheses of the statement for ZMod q in Challenge.lean. Not in
        Challenge.lean, since Mathlib has no Freiman dimension.
    - source: "Chang's theorem for sets of integers, library form"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_of_small_sumset"
      module: "ChangFreimanRuzsa.Integers"
      status: "proved"
      note: >-
        With the exponents intExponent kappa <= 4 * 10^31 kappa^7 for the size and
        containerExponent (2 kappa) for the dimension.
    - source: "Chang's theorem for sets of integers that are not too small, library form"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_int_of_small_sumset"
      module: "ChangFreimanRuzsa.Integers"
      status: "proved"
      note: >-
        For 256 * bohrGAPDim kappa <= |X|, with the exponents of the statement for
        ZMod q. Not in Challenge.lean.
    - source: "Chang's theorem in ZMod q, library form"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_zmod_of_small_sumset"
      module: "ChangFreimanRuzsa.Cyclic"
      status: "proved"
      note: "With the exponents containerExponent and zmodExponent."
    - source: "Chang's theorem in ZMod q with dimension at most the Freiman dimension, library form"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_zmod_dim_le_freimanDim"
      module: "ChangFreimanRuzsa.CyclicFreimanDimension"
      status: "proved"
      note: >-
        With the exponents containerExponent and freimanDimExponent. Not in
        Challenge.lean.
    - source: "Chang's theorem for sets of integers with dimension at most the Freiman dimension, library form"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_int_dim_le_freimanDim"
      module: "ChangFreimanRuzsa.CyclicFreimanDimension"
      status: "proved"
      note: >-
        With the exponent intFreimanDimExponent kappa <= 10^32 kappa^7. Not in
        Challenge.lean.

acknowledgements: >-
  Lean 4 and Mathlib; the APAP project of Yaël Dillies and Bhavik Mehta; the Tau Ceti
  project; the Palomar registry template.
