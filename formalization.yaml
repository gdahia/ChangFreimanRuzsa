# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Chang's theorem"
  description: >-
    Formalization of Chang's polynomial form of Freiman's theorem, with a 2-proper
    progression P, one for which P + P is proper: a finite set X of integers with
    |X + X| <= kappa |X| is contained in a 2-proper generalized arithmetic progression of
    dimension at most the Freiman dimension of X, hence at most 2 kappa - 1, with at most
    exp(10^32 kappa^7) |X| points. There is also a statement for subsets of ZMod q with q
    prime, where the progression has at most exp(10^30 kappa^7) |X| points. The bound on the
    size is weaker than that of Chang. The first step of the proof, the Bogolyubov-Ruzsa lemma,
    is stated too: if moreover |X| >= 7 * 10^7 kappa^2, then 2X - 2X contains a proper
    progression of dimension at most 3 * 10^5 kappa^2 with at least
    exp(-2 * 10^7 kappa^2) |X| points.
  authors:
    - "Gabriel Dahia"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Gabriel Dahia"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["11P70", "11B30", "11B13", "11H06"]

sources:
  - title: "A polynomial bound in Freiman's theorem"
    authors:
      - "Mei-Chu Chang"
    id: "https://doi.org/10.1215/S0012-7094-02-11331-3"
    type: "paper"
    location: "Theorem 2 of Section 1, proved in Sections 2 to 4"
    relationship: "adapts"
    note: >-
      Duke Math. J. 113 (2002). Numbers of results and equations are those of the author's
      preprint. The proof of Theorem 1 follows Chang's: Ruzsa's model (Step 1), a Bohr set
      inside 2A - 2A (Lemmas 3.1 to 3.4), a proper progression inside the Bohr set (Step 3),
      its transport back by a Freiman isomorphism (Lemma 1.2), and the packing argument of
      Section 2. It differs in the following places. Step 1 starts from ZMod q with q prime:
      a set of integers is first reduced modulo a prime q > 16 max |x|, which is a Freiman
      8-isomorphism on it, and the model is taken in ZMod m for any m >= |8X - 8X|, not
      necessarily prime. Lemma 3.1, Chang's bound for a maximal dissociated subset of the large
      spectrum through Rudin's inequality, is the lemma on large spectra of APAP, which puts the
      large spectrum in the {-1, 0, 1}-span of a small set of characters, as in Lemma 3.4.
      Lemmas 3.2 and 3.3 use the chord width |1 - psi(x)| <= 1/4 and the threshold
      (8 kappa)^(-1/2) in place of ||m x / N|| < 1/10 and 100 alpha < rho^(-2) < 1000 alpha.
      Step 3, Theorem 8.7 of Nathanson's book in the paper, is proved here with Minkowski's
      second theorem from Tau Ceti and loses a factor (8 d)^(3 d) in place of (d / epsilon)^d.
      The packing argument of Section 2 runs on the subset X_1 of the model, with sets of
      ceil(3 kappa) disjoint translates in place of 10 alpha. The elements of these sets and of
      the final set F become steps of length 2, in place of the lengths 3 and 2 of (2.21), and
      Ruzsa's covering lemma then covers X by at most 8 kappa translates. Sets too small for
      the Bohr step are first replaced by their sum with a long arithmetic progression. Section
      4, the passage to a proper progression of dimension at most [alpha - 1] through the
      convex bodies of Bilu, is replaced by two other arguments: a properization that divides
      the coefficient lattice by the saturated span of the short relations, through a Smith
      normal form, until the progression is 2-proper, and the reduction to the Freiman
      dimension of Appendix A of Campos, Dahia and Marciano. The bounds proved are weaker; see
      fidelity.divergences.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Compressions, convex geometry and the Freiman-Bilu theorem"
    authors:
      - "Ben Green"
      - "Terence Tao"
    id: "https://arxiv.org/abs/math/0511069"
    type: "paper"
    location: "https://arxiv.org/abs/math/0511069"
    relationship: "background"
    note: >-
      Proposition 1.3 states Chang's theorem with a t-proper progression. The statements
      here are the case t = 2, with a (slightly) weaker notion of 2-proper and weaker bounds.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "On the independence number of sparser random Cayley graphs"
    authors:
      - "Marcelo Campos"
      - "Gabriel Dahia"
      - "João Pedro Marciano"
    id: "https://arxiv.org/abs/2406.09361"
    type: "paper"
    location: "https://arxiv.org/abs/2406.09361"
    relationship: "adapts"
    note: >-
      J. London Math. Soc. 110 (2024). The reduction of the dimension of a 2-proper
      progression to the Freiman dimension of the set it contains follows Appendix A.
    license: "unknown"
    author_endorsement: "participated"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      The statements use pointwise sums of finite sets and ZMod q from Mathlib. The proofs
      use its Freiman isomorphisms, the Plünnecke-Ruzsa inequality, Ruzsa's covering lemma,
      the Fourier transform on finite abelian groups, Z-lattices and Smith normal form.
      Mathlib has no generalized arithmetic progressions and no form of Chang's theorem.
  - id: "https://github.com/gdahia/SumOfSetsInSeveralDimensions"
    relationship: "builds-on"
    note: >-
      A Lake dependency and the source of the Freiman dimension,
      SumOfSetsInSeveralDimensions.freimanDim, and of the bound
      freimanDim_le_two_mul_sub_one_of_card_add_le, which applies Ruzsa's lower bound for
      sumsets to a Freiman model of a set.
  - id: "https://github.com/YaelDillies/apap"
    relationship: "builds-on"
    note: >-
      A Lake dependency and the source of Chang's lemma on large spectra.
  - id: "https://github.com/TauCetiProject/TauCeti"
    relationship: "builds-on"
    note: >-
      A Lake dependency and the source of Minkowski's second theorem for positive definite
      integral lattices.

status:
  scope: >-
    Chang's theorem with a 2-proper progression, for subsets of ZMod q with q prime and for
    finite sets of integers, with the bounds in fidelity.divergences. Chang's lemma on large
    spectra is the one of APAP and Minkowski's second theorem the one of Tau Ceti. The main
    statements give a progression of dimension at most the Freiman dimension of the set.
    Mathlib has no Freiman dimension, so Challenge.lean states instead their corollaries with
    dimension at most 2 kappa - 1, which use the bound freimanDim X <= 2 kappa - 1 for sets
    with |X + X| <= kappa |X| from SumOfSetsInSeveralDimensions. Challenge.lean also states the
    Bogolyubov-Ruzsa lemma for subsets of ZMod q with q prime and for finite sets of integers.
    The sorry counts refer to the library and Solution.lean; Challenge.lean has one placeholder
    for each of its four statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: "Lean 4, Mathlib, shell, the sources of DenseSetsWithoutLargeSumsets, APAP and Tau Ceti."
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        The work began inside the formalization of Campos, Dahia and Marciano, Counting sets
        with given doubling via dimension: one instruction to state Chang's theorem as in
        DenseSetsWithoutLargeSumsets, one to use Minkowski's second theorem from Tau Ceti and
        to import APAP, and one to move the result to this repository in a form that can be
        imported next to PFR. Later, one instruction to move the bound of the dimension by
        the Freiman dimension from DenseSetsWithoutLargeSumsets to this repository, without
        adding it to Challenge.lean. Later, one instruction to make the proof work for sets of
        integers by carrying back to the integers the progression inside 2X - 2X, instead of
        the final progression. Later, one instruction to state the main theorems with
        dimension at most the Freiman dimension, as in Green and Tao, and to deduce from them
        and the bound on the Freiman dimension the statements with dimension at most
        2 kappa - 1. Later, one instruction to lower the exponent of the size bound from
        kappa^20 to kappa^7. Later, one instruction to remove the copies of APAP modules that
        allowed importing this library next to PFR. Later, one instruction to compare the
        definitions of proper and 2-proper progressions with those of Chang, Green and Tao and
        other sources, and to record the numbering of Chang's results; one to make 2-proper
        mean that P + P is proper, with a structure for which P + P is the sum of
        progressions; and one to use the 2-dilate of the coefficient box in properization.
        Later, one instruction to adjust the project to the style rules of the maintainer, one
        to check the documentation and one to drop the direct dependency on AddCombi. Later,
        one instruction to carry the removal of redundant casts in Challenge.lean over to the
        library and to drop the definition of 2-properness. Later, one instruction to add the
        Bogolyubov-Ruzsa statements to Challenge.lean and Solution.lean.
  spend_usd: "not tracked"
  notes: >-
    An AI agent directed by Gabriel Dahia ported the copied modules, rewrote the Bohr step
    with Minkowski's second theorem, removed unused declarations, and wrote the statements
    for ZMod q and for integers, the bounds for the exponents, Challenge.lean and
    Solution.lean. The proofs in the copied modules are those of
    DenseSetsWithoutLargeSumsets, which were written by Codex agents. The agent also rewrote
    the modules that bound the dimension by the Freiman dimension, keeping the argument and
    the definition of the Freiman dimension. For the statement for integers with a bound
    linear in |X|, the agent restated the covering argument and the properization for
    general abelian groups, replaced the successive minima of the lattice of relations by
    the number of independent short relations, and rewrote Integers.lean. Later, agents
    rewrote the proofs and docstrings of the library to follow Mathlib style: they split long
    proofs into lemmas, replaced local definitions by those of Mathlib and APAP, and renamed
    auxiliary declarations, without changing the main statements. Later, the agent derived
    the main statements with dimension at most the Freiman dimension, for every finite set
    of integers, and replaced the bounds on the dimension in Challenge.lean by 2 kappa - 1.
    Later, agents lowered the exponent from kappa^20 to kappa^7: they sharpened the
    estimates of the Bohr progression, of Chang's lemma and of properization, and added the
    elements of the last packing set as steps of the progression instead of covering by
    their differences. Later, the agent replaced the structure GAP by an origin and a
    finitely supported bound, defined the sum of two progressions and 2-properness as the
    properness of P + P, and adapted the proofs; properization now uses the 2-dilate of the
    coefficient box, no longer doubles the lengths, and has the exponent
    2 (d + 2)^3 log (d + 2) in place of 3 (d + 2)^3 log (d + 2). Later, the agent replaced
    the import of all of Mathlib in Challenge.lean by the modules its statements need, and
    made the headers, spelling and notation of the docstrings uniform. It also replaced the
    indicator notation and the two lemmas on indicator functions taken from AddCombi by a local
    notation and lemmas of Mathlib, so that AddCombi is only a dependency of APAP. Later, the
    agent removed the definition of 2-properness, which the statements now write as
    (P + P).Proper, and the casts that Lean inserts itself. Later, the agent stated the
    Bogolyubov-Ruzsa lemma with explicit bounds, bounding the dimension bohrGAPDim kappa and the
    loss 8 bohrLoss (bohrGAPDim kappa), and added it to Challenge.lean and Solution.lean. Every
    proof is checked by Lean.

fidelity:
  divergences: >-
    Chang's Theorem 2 (Section 1) puts a finite set A of integers with |A + A| <= alpha |A|
    in a proper progression P of dimension at most [alpha - 1] with
    log (|P| / |A|) <= C alpha^2 (log alpha)^3 for an absolute constant C. Her Theorem 1
    gives a progression that need not be proper, with dimension and log (|P| / |A|) at most
    C alpha^2 (log alpha)^2. Green and Tao, Proposition 1.3 with t = 2, state Theorem 2 with a
    2-proper progression of dimension at most the Freiman dimension of A and
    |P| <= exp(C K^2 log^3 K) |A|, where K = |A + A| / |A|. The statements here take the form
    of Green and Tao: the progression is 2-proper in a sense weaker than theirs that still
    implies proper, the dimension is bounded by freimanDim X or by 2 kappa - 1 in place of
    [alpha - 1], the constants are explicit and the exponent of the size bound is a multiple
    of kappa^7.

    Here freimanDim X is the largest d <= |X| such that X is Freiman isomorphic of order 2
    to a subset of Q^d whose affine span over the reals has dimension d.

    Integers. exists_twoProperGAP_subset_dim_le_freimanDim_card_le takes kappa >= 2 with
    |X + X| <= kappa |X| and gives |P| <= exp(10^32 kappa^7) |X| and dimension at most
    freimanDim X.

    ZMod q. exists_twoProperGAP_zmod_subset_dim_le_freimanDim_card_le is for q prime and
    needs 7 * 10^7 kappa^2 <= |X| and exp(10^30 kappa^7) |X| <= q. It gives a
    2-proper progression of dimension at most freimanDim X with at most
    exp(10^30 kappa^7) |X| points. Chang works in Z only, so these statements have no
    counterpart in her paper.

    Dimension at most 2 kappa - 1. The statements of Challenge.lean are the same with
    dimension at most 2 kappa - 1 in place of freimanDim X. Green and Tao get
    floor(K - 1 + epsilon) for |A| >= C K^2 / epsilon.

    Bogolyubov-Ruzsa lemma. Chang's Proposition 2.1 puts in 2A - 2A a proper progression with
    the dimension of (2.1), of order alpha log alpha, and the size of (2.2).
    exists_proper_gap_subset_add_sub_add_dim_le_card_le and
    exists_proper_gap_zmod_subset_add_sub_add_dim_le_card_le need 2 <= kappa and
    |X| >= 7 * 10^7 kappa^2, and the latter q prime. They give dimension at most
    3 * 10^5 kappa^2 and |X| <= exp(2 * 10^7 kappa^2) |Q|.

    A progression is a structure GAP with an origin x_0 and a finitely supported bound
    b : G -> N; its points are x_0 + sum_v c_v v with c <= b. Its steps are the v with
    b_v > 0, of length b_v + 1, and its dimension is their number. Numbering the steps gives
    the points x_0 + sum_i w_i s_i with 0 <= w_i < l_i of (1.1) of Chang, with all lengths
    at least 2. A progression is proper if these points are distinct. Chang calls a
    progression proper if |P| is the product of the lengths, which is GAP.Proper by
    GAP.proper_iff_card_eq_prod_length. The sum P + Q adds origins and bounds, so its points
    are the sums of a point of P and a point of Q, and P is 2-proper if P + P is proper: the
    points 2 x_0 + sum_i w_i s_i with 0 <= w_i <= 2 l_i - 2 are distinct. This is the
    condition F_2 of Bilu and the 2-proper progression of Tao and Vu. The t-proper progression
    of Green and Tao, Definition 1.1, for t = 2 asks the same for 0 <= w_i <= 2 l_i - 1, which
    is stronger: {0, 1} in ZMod 3 is 2-proper here but not in their sense. The statements
    here are therefore weaker than Proposition 1.3 of Green and Tao with t = 2 in this
    respect.

review:
  status: "self-assessed"
  reviewers:
    - "Gabriel Dahia"
  notes: >-
    Gabriel Dahia reviewed all the main statements and the definitions they use, and found
    them correct. The maintainer also reviewed the overall structure of the proof, which the
    maintainer directed in this project and in the previous projects it comes from. Not every
    proof has been reviewed in detail. No independent reviewer has checked the development.

alignment:
  namespace: "ChangFreimanRuzsa"
  statements:
    - source: "Chang, Proposition 2.1 (the Bogolyubov-Ruzsa lemma)"
      lean: "ChangFreimanRuzsa.exists_proper_gap_subset_add_sub_add_dim_le_card_le'"
      module: "ChangFreimanRuzsaPalomar.Challenge"
      status: "proved"
      note: >-
        For |X| >= 7 * 10^7 kappa^2, with dimension at most 3 * 10^5 kappa^2 and
        |X| <= exp(2 * 10^7 kappa^2) |Q|.
    - source: "Chang, Proposition 2.1 (the Bogolyubov-Ruzsa lemma), in ZMod q"
      lean: "ChangFreimanRuzsa.exists_proper_gap_zmod_subset_add_sub_add_dim_le_card_le'"
      module: "ChangFreimanRuzsaPalomar.Challenge"
      status: "proved"
      note: >-
        For q prime and |X| >= 7 * 10^7 kappa^2, with dimension at most 3 * 10^5 kappa^2 and
        |X| <= exp(2 * 10^7 kappa^2) |Q|.
    - source: "Chang, Theorem 2, with a 2-proper progression"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_subset_dim_le_card_le'"
      module: "ChangFreimanRuzsaPalomar.Challenge"
      status: "proved"
      note: "With at most exp(10^32 kappa^7) |X| points and dimension at most 2 kappa - 1."
    - source: "Chang, Theorem 2, in ZMod q with a 2-proper progression"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_zmod_subset_dim_le_card_le'"
      module: "ChangFreimanRuzsaPalomar.Challenge"
      status: "proved"
      note: >-
        For q prime, 7 * 10^7 kappa^2 <= |X| and exp(10^30 kappa^7) |X| <= q, with
        dimension at most 2 kappa - 1.
    - source: "Green and Tao, Proposition 1.3 with t = 2, for sets of integers"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_subset_dim_le_freimanDim_card_le"
      module: "ChangFreimanRuzsa.Explicit"
      status: "proved"
      note: >-
        With at most exp(10^32 kappa^7) |X| points. Not in Challenge.lean, since Mathlib has
        no Freiman dimension.
    - source: "Green and Tao, Proposition 1.3 with t = 2, in ZMod q"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_zmod_subset_dim_le_freimanDim_card_le"
      module: "ChangFreimanRuzsa.Explicit"
      status: "proved"
      note: >-
        With the hypotheses of the statement for ZMod q in Challenge.lean. Not in
        Challenge.lean, since Mathlib has no Freiman dimension.
    - source: "Chang's theorem for sets of integers, library form"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_of_small_sumset"
      module: "ChangFreimanRuzsa.Int"
      status: "proved"
      note: >-
        With the exponents intExponent kappa <= 4 * 10^31 kappa^7 for the size and
        containerExponent (2 kappa) for the dimension.
    - source: "Chang's theorem for sets of integers that are not too small, library form"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_int_of_small_sumset"
      module: "ChangFreimanRuzsa.Int"
      status: "proved"
      note: >-
        For 256 * bohrGAPDim kappa <= |X|, with the exponents of the statement for
        ZMod q. Not in Challenge.lean.
    - source: "Chang's theorem in ZMod q, library form"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_zmod_of_small_sumset"
      module: "ChangFreimanRuzsa.ZMod"
      status: "proved"
      note: "With the exponents containerExponent and zmodExponent."
    - source: "Chang's theorem in ZMod q with dimension at most the Freiman dimension, library form"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_zmod_dim_le_freimanDim"
      module: "ChangFreimanRuzsa.FreimanDim"
      status: "proved"
      note: >-
        With the exponents containerExponent and freimanDimExponent. Not in
        Challenge.lean.
    - source: "Chang's theorem for sets of integers with dimension at most the Freiman dimension, library form"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_int_dim_le_freimanDim"
      module: "ChangFreimanRuzsa.FreimanDim"
      status: "proved"
      note: >-
        With the exponent intFreimanDimExponent kappa <= 10^32 kappa^7. Not in
        Challenge.lean.
    - source: "Chang, Theorem 1"
      lean: "ChangFreimanRuzsa.exists_gap_int_subset_dim_le_card_le"
      module: "ChangFreimanRuzsa.Int"
      status: "proved"
      note: >-
        For 256 * bohrGAPDim kappa <= |X|. The dimension and log (|P| / |X|) are at most
        containerExponent kappa <= 1.3 * 10^8 kappa^2 (1 + log kappa)^2, which has the form
        C alpha^2 (log alpha)^2 of Theorem 1. Not in Challenge.lean.
    - source: "Chang, Proposition 2.1, in ZMod q"
      lean: "ChangFreimanRuzsa.exists_proper_gap_zmod_subset_add_sub_add_card_le"
      module: "ChangFreimanRuzsa.BogolyubovRuzsa.ZMod"
      status: "proved"
      note: >-
        For q prime and 256 * bohrGAPDim kappa <= |X|. The dimension is at most
        bohrGAPDim kappa, of order kappa log kappa as in (2.1), and
        |X| <= 8 (8 d)^(3 d) |Q| in place of (2.2). The version for integers is
        exists_proper_gap_int_subset_add_sub_add_card_le of Integers.lean.
    - source: "Chang, Section 1, Step 1 (Ruzsa's model)"
      lean: "ChangFreimanRuzsa.exists_subset_card_le_mul_card_isAddFreimanIso_of_card_add_le"
      module: "ChangFreimanRuzsa.BogolyubovRuzsa.RuzsaModel"
      status: "proved"
      note: "From ZMod q with q prime, in place of Z, into ZMod m for any m >= |sX - sX|."
    - source: "Chang, Lemma 3.1"
      lean: "ChangFreimanRuzsa.exists_card_le_largeSpec_subset_addSpan"
      module: "ChangFreimanRuzsa.BogolyubovRuzsa.Fourier"
      status: "proved"
      note: >-
        Applies the lemma on large spectra of APAP, which bounds a set whose {-1, 0, 1}-span
        contains the large spectrum, in place of a maximal dissociated subset of it.
    - source: "Chang, Lemma 3.2"
      lean: "ChangFreimanRuzsa.mem_add_sub_add_of_card_add_le_of_forall_largeSpec"
      module: "ChangFreimanRuzsa.BogolyubovRuzsa.Fourier"
      status: "proved"
      note: "With the threshold (8 kappa)^(-1/2) and the chord width 1/4."
    - source: "Chang, Lemma 3.3"
      lean: "ChangFreimanRuzsa.card_pow_three_le_mul_addEnergy"
      module: "ChangFreimanRuzsa.BogolyubovRuzsa.Fourier"
      status: "proved"
      note: "Stated as |X|^3 <= kappa E(X) for the additive energy E(X)."
    - source: "Chang, Lemma 3.4"
      lean: "ChangFreimanRuzsa.mem_add_sub_add_of_largeSpec_subset_addSpan"
      module: "ChangFreimanRuzsa.BogolyubovRuzsa.Fourier"
      status: "proved"
      note: "With the chord width (4 (|Delta| + 1))^(-1)."
    - source: "Chang, Section 1, Step 3 (a proper progression in a Bohr set)"
      lean: "ChangFreimanRuzsa.exists_proper_gap_chordSet"
      module: "ChangFreimanRuzsa.BogolyubovRuzsa.BohrSet"
      status: "proved"
      note: "Through Minkowski's second theorem from Tau Ceti; ZMod q need not have q prime."
    - source: "Chang, Lemma 1.2"
      lean: "ChangFreimanRuzsa.GAP.exists_proper_carrier_eq_image_of_isAddFreimanIso"
      module: "ChangFreimanRuzsa.GAP.FreimanHom"
      status: "proved"
      note: >-
        For Freiman 2-isomorphisms on a proper progression. The transport of (1.22), from
        2B - 2B to 2A - 2A along a Freiman 8-isomorphism, is
        exists_proper_gap_subset_add_sub_add_of_isAddFreimanIso.
    - source: "Chang, Section 2"
      lean: "ChangFreimanRuzsa.exists_gap_subset_dim_le_card_le_of_subset_add_sub_add"
      module: "ChangFreimanRuzsa.Covering.Container"
      status: "proved"
      note: >-
        In an arbitrary abelian group, with sets of ceil(3 kappa) translates and a final
        application of Ruzsa's covering lemma.
    - source: "Chang, Section 4"
      lean: "ChangFreimanRuzsa.exists_twoProperGAP_subset_dim_le_card_le_of_subset_gap"
      module: "ChangFreimanRuzsa.ZMod"
      status: "proved"
      note: >-
        A different argument: properization through the short relations of the progression,
        followed by the reduction to the Freiman dimension,
        exists_twoProperGAP_dim_le_freimanDim_of_isAddTorsionFree in
        ChangFreimanRuzsa.FreimanDimension.CoordinateReduction.
    - source: "Chang, Section 1, definition of a proper progression"
      lean: "ChangFreimanRuzsa.GAP.proper_iff_card_eq_prod_length"
      module: "ChangFreimanRuzsa.GAP.Basic"
      status: "proved"
      note: "Chang's |P| = l(P) is equivalent to GAP.Proper, the distinctness of the points."

